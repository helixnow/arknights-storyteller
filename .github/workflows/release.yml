name: release-android

# TODO(desktop-updater): 桌面端 updater 的更新源写死在
# arknights-story-reader/src-tauri/tauri.conf.json（plugins.updater.endpoints）：
#   https://github.com/helixnow/arknights-storyteller/releases/latest/download/latest.json
# 本工作流只构建 Android 产物（APK + android-latest.json），不会构建桌面安装包，也不会
# 生成新的桌面 feed；下方的 "Carry over desktop updater feed" 步骤只是把上一个 Release
# 里已有的 latest.json 原样带到新 Release，避免每次 Android 发布后该 URL 变成 404。
# 桌面 feed 的首次上传与桌面版本更新仍需手工完成（需要与 pubkey 配对的
# TAURI_SIGNING_PRIVATE_KEY），步骤见 arknights-story-reader/README.md「桌面更新源的现状」。

on:
  workflow_dispatch:
  push:
    branches:
      - release

env:
  CARGO_TERM_COLOR: always

jobs:
  check-android-secrets:
    name: Check Android signing secrets
    runs-on: ubuntu-24.04
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - id: check
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

  android:
    name: Build signed Android APK
    needs: check-android-secrets
    if: needs.check-android-secrets.outputs.has_keystore == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: arknights-story-reader/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          # Android SDK is pre-installed on ubuntu runners
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required packages
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"
          
          # Set NDK_HOME after NDK installation
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: arknights-story-reader/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: arknights-story-reader

      - name: Validate and get app version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(awk '
            /^\[package\]$/ { in_package=1; next }
            in_package && /^version = / {
              gsub(/^version = "|"$|"/, "")
              print
              exit
            }
          ' src-tauri/Cargo.toml)
          CARGO_LOCK_VERSION=$(awk '
            /^\[\[package\]\]$/ { name=""; version="" }
            /^name = "story-teller"$/ { name="story-teller" }
            name == "story-teller" && /^version = / {
              gsub(/^version = "|"$|"/, "")
              print
              exit
            }
          ' src-tauri/Cargo.lock)

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          for candidate in \
            "$LOCK_VERSION" \
            "$LOCK_ROOT_VERSION" \
            "$TAURI_VERSION" \
            "$CARGO_VERSION" \
            "$CARGO_LOCK_VERSION"; do
            if [ "$candidate" != "$VERSION" ]; then
              echo "Version mismatch: expected $VERSION, found $candidate" >&2
              exit 1
            fi
          done

          echo "Using repository version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        working-directory: arknights-story-reader

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VERSION: "${{ steps.get_version.outputs.version }}"
        run: |
          TAG="app-v${VERSION}"
          RELEASE_NAME="明日方舟剧情阅读器 v${VERSION}"
          
          # Never reuse an existing release or tag: doing so could overwrite old assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new repository version." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; choose a new repository version." >&2
            exit 1
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              echo "Failed to check whether tag $TAG exists." >&2
              exit "$STATUS"
            fi
          fi

          echo "Creating new release $TAG"
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_NAME" \
            --notes "自动构建版本。Android APK 安装包。" \
            --draft \
            --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend with update feed
        env:
          VITE_ANDROID_UPDATE_FEED: "https://github.com/${{ github.repository }}/releases/latest/download/android-latest.json"
          VITE_ANDROID_ANNOUNCEMENTS_URL: "https://raw.githubusercontent.com/${{ github.repository }}/release/android-announcements.json"
        run: npm run build
        working-directory: arknights-story-reader

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          mkdir -p src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > src-tauri/gen/android/upload-keystore.jks
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${GITHUB_WORKSPACE}/arknights-story-reader/src-tauri/gen/android/upload-keystore.jks
          EOF
        working-directory: arknights-story-reader

      - name: Build signed Android APK
        env:
          RELEASE_STRICT: "1"
          RELEASE_JOB: "true"
          ANDROID_KEYSTORE_PATH: "${{ github.workspace }}/arknights-story-reader/src-tauri/gen/android/upload-keystore.jks"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
          VITE_ANDROID_UPDATE_FEED: "https://github.com/${{ github.repository }}/releases/latest/download/android-latest.json"
          VITE_ANDROID_ANNOUNCEMENTS_URL: "https://raw.githubusercontent.com/${{ github.repository }}/release/android-announcements.json"
          SKIP_WEB_BUILD: "1"
        run: bash scripts/build-apk.sh
        working-directory: arknights-story-reader

      - name: Upload APK to release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VERSION: "${{ steps.get_version.outputs.version }}"
          TAG: "${{ steps.create_release.outputs.tag }}"
        run: |
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Signed APK not found at $APK_PATH" >&2
            exit 1
          fi
          RELEASE_NAME="arknights-story-reader-android-${VERSION}.apk"
          RENAMED_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/${RELEASE_NAME}"
          cp "$APK_PATH" "$RENAMED_APK"
          gh release upload "$TAG" "$RENAMED_APK" --clobber
        working-directory: arknights-story-reader

      - name: Publish Android update manifest
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VERSION: "${{ steps.get_version.outputs.version }}"
          TAG: "${{ steps.create_release.outputs.tag }}"
          REPO: "${{ github.repository }}"
        run: |
          APK_NAME="arknights-story-reader-android-${VERSION}.apk"
          JSON_PATH="android-latest.json"
          echo "{" > "$JSON_PATH"
          echo "  \"version\": \"$VERSION\"," >> "$JSON_PATH"
          echo "  \"notes\": \"\"," >> "$JSON_PATH"
          echo "  \"url\": \"https://github.com/$REPO/releases/download/$TAG/$APK_NAME\"," >> "$JSON_PATH"
          echo "  \"fileName\": \"$APK_NAME\"" >> "$JSON_PATH"
          echo "}" >> "$JSON_PATH"
          cat "$JSON_PATH"
          gh release upload "$TAG" "$JSON_PATH" --clobber
        working-directory: arknights-story-reader

      # 桌面 updater 从 releases/latest/download/latest.json 读取更新 feed（见 TODO 注释）。
      # 本工作流每次都会创建新的 latest Release，若不搬运，手工上传过的桌面 feed 会被
      # 留在旧 Release 上导致该 URL 404。feed 内的下载链接指向 releases/download/<旧 tag>/…，
      # 旧资产与 minisign 签名保持有效，因此原样搬运是安全的。此步骤任何失败都不会
      # 中断 Android 发布。
      - name: Carry over desktop updater feed (latest.json)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.create_release.outputs.tag }}"
          REPO: "${{ github.repository }}"
        run: |
          PREV_TAG=$(gh api "repos/$REPO/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name == "latest.json"))][0].tag_name // empty' \
            || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release carries latest.json; skipping desktop feed carry-over."
            echo "Desktop updater feed must be seeded manually, see arknights-story-reader/README.md."
            exit 0
          fi
          echo "Carrying over latest.json from $PREV_TAG to $TAG"
          TMP_DIR=$(mktemp -d)
          if gh release download "$PREV_TAG" --pattern latest.json --dir "$TMP_DIR" \
            && gh release upload "$TAG" "$TMP_DIR/latest.json" --clobber; then
            echo "Desktop updater feed carried over to $TAG."
          else
            echo "::warning::Failed to carry over latest.json from $PREV_TAG; desktop updater feed may 404 until re-uploaded manually."
          fi

      - name: Publish release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.create_release.outputs.tag }}"
        run: |
          echo "Publishing release $TAG"
          gh release edit "$TAG" --draft=false
        working-directory: arknights-story-reader

      - name: Cleanup keystore
        if: always()
        run: rm -f src-tauri/gen/android/upload-keystore.jks src-tauri/gen/android/keystore.properties
        working-directory: arknights-story-reader
